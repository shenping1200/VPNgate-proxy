<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VPNGate Proxy Pool</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a212b; --panel2:#222c38; --line:#2c3744;
    --txt:#e6edf3; --mut:#8b98a9; --acc:#3b82f6; --ok:#22c55e; --bad:#ef4444;
    --warn:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:18px;font-weight:600;letter-spacing:.3px}
  header .v{font-size:12px;color:var(--mut);margin-left:auto}
  .wrap{padding:20px 22px;max-width:1200px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card .k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card .n{font-size:26px;font-weight:700;margin-top:6px}
  .card .n.ok{color:var(--ok)} .card .n.bad{color:var(--bad)}
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .bar .upd{color:var(--mut);font-size:12px;margin-left:auto}
  button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:600}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:var(--panel2);border:1px solid var(--line)}
  label.tg{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:13px;cursor:pointer}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
  th{background:var(--panel2);color:var(--mut);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
  tr:last-child td{border-bottom:0}
  td.mono,th.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
  .badge.ok{background:rgba(34,197,94,.15);color:var(--ok)}
  .badge.bad{background:rgba(239,68,68,.15);color:var(--bad)}
  .banner{background:rgba(245,158,11,.12);border:1px solid var(--warn);color:var(--warn);
    padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px}
  .empty{color:var(--mut);text-align:center;padding:40px}
  @media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>🐉 VPNGate Proxy Pool</h1>
  <span class="v" id="meta">—</span>
</header>
<div class="wrap">
  <div id="banner" class="banner" style="display:none"></div>
  <div class="cards">
    <div class="card"><div class="k">Live Ports</div><div class="n ok" id="c-live">0</div></div>
    <div class="card"><div class="k">Total Slots</div><div class="n" id="c-total">0</div></div>
    <div class="card"><div class="k">Countries</div><div class="n" id="c-countries">0</div></div>
    <div class="card"><div class="k">Start Port</div><div class="n mono" id="c-start">—</div></div>
  </div>
  <div class="bar">
    <button id="rebal">Force Rebalance</button>
    <label class="tg"><input type="checkbox" id="auto" checked /> Auto-refresh (5s)</label>
    <span class="upd" id="upd">—</span>
  </div>
  <table>
    <thead>
      <tr>
        <th>#</th><th class="mono">Port</th><th>Country</th><th class="mono">Exit IP</th>
        <th class="mono">Node ID</th><th class="mono">Device</th><th>Status</th><th>Uptime</th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
  </table>
</div>
<script>
const $ = id => document.getElementById(id);

function fmtUptime(s){
  if(!s && s!==0) return "—";
  if(s<60) return s+"s";
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if(h>0) return h+"h "+m+"m";
  if(m>0) return m+"m "+sec+"s";
  return sec+"s";
}
function showBanner(msg){ const b=$("banner"); b.textContent=msg; b.style.display="block"; }
function hideBanner(){ $("banner").style.display="none"; }

async function loadStats(){
  const r = await fetch("/api/v1/pool/statistics", {credentials:"include"});
  if(r.status===401){ showBanner("未授权：请在浏览器弹窗中输入管理面板账号密码（默认 admin / 代理密码）。"); return null; }
  if(!r.ok) return null;
  return r.json();
}
async function loadSlots(){
  const r = await fetch("/api/v1/pool/slots", {credentials:"include"});
  if(r.status===401){ return null; }
  if(!r.ok) return [];
  return r.json();
}

async function refresh(){
  try{
    const [st, sl] = await Promise.all([loadStats(), loadSlots()]);
    if(!st) return;
    hideBanner();
    $("c-live").textContent = st.live_slots;
    $("c-live").className = "n " + (st.live_slots>0?"ok":"bad");
    $("c-total").textContent = st.total_slots;
    $("c-countries").textContent = st.countries;
    $("c-start").textContent = st.start_port;
    $("meta").textContent = "v"+st.version+" · "+st.hostname+" · user: "+st.web_user;
    const rows = (sl||[]).map((s,i)=>`
      <tr>
        <td>${i+1}</td>
        <td class="mono">${s.port}</td>
        <td>${s.country||"—"}</td>
        <td class="mono">${s.exit_ip||"—"}</td>
        <td class="mono" title="${s.node_id}">${s.node_id.slice(0,12)||"—"}</td>
        <td class="mono">${s.device}</td>
        <td>${s.running?'<span class="badge ok">UP</span>':'<span class="badge bad">DOWN</span>'}</td>
        <td>${fmtUptime(s.uptime_secs)}</td>
      </tr>`).join("");
    $("rows").innerHTML = rows || `<tr><td colspan="8" class="empty">No slots mapped yet.</td></tr>`;
    $("upd").textContent = "updated " + new Date().toLocaleTimeString();
  }catch(e){ showBanner("请求失败："+e.message); }
}

$("rebal").addEventListener("click", async ()=>{
  $("rebal").disabled = true;
  try{
    const r = await fetch("/api/v1/pool/reconcile", {method:"POST", credentials:"include"});
    if(r.status===401){ showBanner("未授权。"); return; }
    await refresh();
  }catch(e){ showBanner("rebalance 失败："+e.message); }
  finally{ $("rebal").disabled = false; }
});

let timer=null;
function schedule(){ if(timer) clearInterval(timer); if($("auto").checked) timer=setInterval(refresh,5000); }
$("auto").addEventListener("change", schedule);

refresh(); schedule();
</script>
</body>
</html>
