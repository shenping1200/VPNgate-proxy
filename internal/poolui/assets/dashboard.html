<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VPNGate 代理池</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a212b; --panel2:#222c38; --line:#2c3744;
    --txt:#e6edf3; --mut:#8b98a9; --acc:#3b82f6; --ok:#22c55e; --bad:#ef4444;
    --warn:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:18px;font-weight:600;letter-spacing:.3px}
  header .v{font-size:12px;color:var(--mut);margin-left:auto}
  .wrap{padding:20px 22px;max-width:1200px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card .k{color:var(--mut);font-size:12px;letter-spacing:.5px}
  .card .n{font-size:26px;font-weight:700;margin-top:6px}
  .card .n.ok{color:var(--ok)} .card .n.bad{color:var(--bad)}
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .bar .upd{color:var(--mut);font-size:12px;margin-left:auto}
  button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:600}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:var(--panel2);border:1px solid var(--line)}
  label.tg{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:13px;cursor:pointer}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
  th{background:var(--panel2);color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.5px}
  tr:last-child td{border-bottom:0}
  td.mono,th.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
  .badge.ok{background:rgba(34,197,94,.15);color:var(--ok)}
  .badge.bad{background:rgba(239,68,68,.15);color:var(--bad)}
  .banner{background:rgba(245,158,11,.12);border:1px solid var(--warn);color:var(--warn);
    padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:13px}
  .empty{color:var(--mut);text-align:center;padding:40px}
  @media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>🐉 VPNGate 代理池</h1>
  <span class="v" id="meta">—</span>
</header>
<div class="wrap">
  <div id="banner" class="banner" style="display:none"></div>
  <div class="cards">
    <div class="card"><div class="k">在线端口</div><div class="n ok" id="c-live">0</div></div>
    <div class="card"><div class="k">总端口数</div><div class="n" id="c-total">0</div></div>
    <div class="card"><div class="k">国家数量</div><div class="n" id="c-countries">0</div></div>
    <div class="card"><div class="k">起始端口</div><div class="n mono" id="c-start">—</div></div>
  </div>
  <div class="bar">
    <button id="rebal">强制重平衡</button>
    <label class="tg"><input type="checkbox" id="auto" checked /> 自动刷新（5秒）</label>
    <span class="upd" id="upd">—</span>
  </div>

  <div class="card" style="margin-bottom:20px">
    <div class="k">SOCKS5 代理账号密码</div>
    <div style="color:var(--mut);font-size:12px;margin:6px 0 12px">
      当前账号：<span class="mono" id="pc-user">—</span>
      （客户端连接格式：<span class="mono" id="pc-sample">—</span>）
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div style="display:flex;flex-direction:column;gap:4px">
        <label class="tg" style="cursor:default">代理账号</label>
        <input id="pc-username" type="text" placeholder="vpnuser"
          style="background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 12px;font-size:13px;min-width:180px" />
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <label class="tg" style="cursor:default">代理密码</label>
        <input id="pc-password" type="text" placeholder="留空则保持原密码"
          style="background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 12px;font-size:13px;min-width:220px" />
      </div>
      <button id="pc-save">保存代理凭据</button>
      <span id="pc-msg" style="color:var(--ok);font-size:13px"></span>
    </div>
  </div>

  <div class="card" style="margin-bottom:20px">
    <div class="k">旋转端口（自动轮换 IP）</div>
    <div style="color:var(--mut);font-size:12px;margin:6px 0 12px">
      端口 <span class="mono" id="rt-port">—</span> ·
      客户端账号填 <span class="mono">环境标识</span>（如 env1）、密码留空 → 每个环境固定不同 IP；
      账号密码都留空 → 每连接随机轮换。
    </div>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <button id="rt-recycle-all" class="ghost">全部换 IP</button>
      <span id="rt-msg" style="color:var(--ok);font-size:13px"></span>
    </div>
    <table>
      <thead><tr>
        <th>会话（账号）</th><th class="mono">绑定端口</th><th>国家</th>
        <th class="mono">出口 IP</th><th>状态</th><th>操作</th>
      </tr></thead>
      <tbody id="rt-rows"><tr><td colspan="6" class="empty">暂无连接会话。</td></tr></tbody>
    </table>
  </div>

  <table>
    <thead>
      <tr>
        <th>序号</th><th class="mono">端口</th><th>国家</th><th class="mono">出口 IP</th>
        <th class="mono">节点 ID</th><th class="mono">设备</th><th>状态</th><th>运行时长</th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="8" class="empty">加载中…</td></tr></tbody>
  </table>
</div>
<script>
const $ = id => document.getElementById(id);

function fmtUptime(s){
  if(!s && s!==0) return "—";
  if(s<60) return s+"秒";
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if(h>0) return h+"小时"+m+"分";
  if(m>0) return m+"分"+sec+"秒";
  return sec+"秒";
}
function showBanner(msg){ const b=$("banner"); b.textContent=msg; b.style.display="block"; }
function hideBanner(){ $("banner").style.display="none"; }

async function loadStats(){
  const r = await fetch("/api/v1/pool/statistics", {credentials:"include"});
  if(r.status===401){ showBanner("未授权：请在浏览器弹窗中输入管理面板账号密码（默认 admin / 代理密码）。"); return null; }
  if(!r.ok) return null;
  return r.json();
}
async function loadSlots(){
  const r = await fetch("/api/v1/pool/slots", {credentials:"include"});
  if(r.status===401){ return null; }
  if(!r.ok) return [];
  return r.json();
}

async function refresh(){
  try{
    const [st, sl] = await Promise.all([loadStats(), loadSlots()]);
    if(!st) return;
    hideBanner();
    $("c-live").textContent = st.live_slots;
    $("c-live").className = "n " + (st.live_slots>0?"ok":"bad");
    $("c-total").textContent = st.total_slots;
    $("c-countries").textContent = st.countries;
    $("c-start").textContent = st.start_port;
    $("rt-port").textContent = st.rotate_port || "—";
    $("meta").textContent = "v"+st.version+" · "+st.hostname+" · 账号："+st.web_user;
    const rows = (sl||[]).map((s,i)=>`
      <tr>
        <td>${i+1}</td>
        <td class="mono">${s.port}</td>
        <td>${s.country||"—"}</td>
        <td class="mono">${s.exit_ip||"—"}</td>
        <td class="mono" title="${s.node_id}">${s.node_id.slice(0,12)||"—"}</td>
        <td class="mono">${s.device}</td>
        <td>${s.running?'<span class="badge ok">在线</span>':'<span class="badge bad">离线</span>'}</td>
        <td>${fmtUptime(s.uptime_secs)}</td>
      </tr>`).join("");
    $("rows").innerHTML = rows || `<tr><td colspan="8" class="empty">暂未映射任何端口。</td></tr>`;
    $("upd").textContent = "更新于 " + new Date().toLocaleTimeString();
    await loadRotateSessions();
  }catch(e){ showBanner("请求失败："+e.message); }
}

async function loadRotateSessions(){
  try{
    const r = await fetch("/api/v1/pool/rotate/sessions", {credentials:"include"});
    if(r.status===401) return;
    if(!r.ok) return;
    const list = await r.json();
    const rows = (list||[]).map(s=>`
      <tr>
        <td class="mono">${s.session}</td>
        <td class="mono">${s.port||"—"}</td>
        <td>${s.country||"—"}</td>
        <td class="mono">${s.exit_ip||"—"}</td>
        <td>${s.running?'<span class="badge ok">在线</span>':'<span class="badge bad">离线</span>'}</td>
        <td><button class="ghost rt-one" data-session="${s.session}">换 IP</button></td>
      </tr>`).join("");
    $("rt-rows").innerHTML = rows || `<tr><td colspan="6" class="empty">暂无连接会话。</td></tr>`;
    document.querySelectorAll("#rt-rows button.rt-one").forEach(b=>{
      b.addEventListener("click", ()=> recycleOne(b.dataset.session));
    });
  }catch(e){ /* ignore */ }
}

function recycleOne(session){
  fetch("/api/v1/pool/rotate/recycle", {
    method:"POST", credentials:"include",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({session})
  }).then(()=>{
    $("rt-msg").textContent = "已为「"+session+"」重新分配 IP";
    setTimeout(()=>{ $("rt-msg").textContent=""; }, 3000);
    refresh();
  }).catch(e=> showBanner("换 IP 失败："+e.message));
}

$("rt-recycle-all").addEventListener("click", async ()=>{
  try{
    const r = await fetch("/api/v1/pool/rotate/recycle", {
      method:"POST", credentials:"include",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session:""})
    });
    if(r.status===401){ showBanner("未授权。"); return; }
    $("rt-msg").textContent = "已全部重新分配 IP";
    setTimeout(()=>{ $("rt-msg").textContent=""; }, 3000);
    await refresh();
  }catch(e){ showBanner("换 IP 失败："+e.message); }
});

$("rebal").addEventListener("click", async ()=>{
  $("rebal").disabled = true;
  try{
    const r = await fetch("/api/v1/pool/reconcile", {method:"POST", credentials:"include"});
    if(r.status===401){ showBanner("未授权。"); return; }
    await refresh();
  }catch(e){ showBanner("重平衡失败："+e.message); }
  finally{ $("rebal").disabled = false; }
});

async function loadProxyCreds(){
  try{
    const r = await fetch("/api/v1/pool/proxy-credentials", {credentials:"include"});
    if(r.status===401) return;
    if(!r.ok) return;
    const d = await r.json();
    $("pc-user").textContent = d.username || "—";
    $("pc-sample").textContent = d.username ? (d.username+":***@161.33.24.16:端口") : "—";
    $("pc-username").value = d.username || "";
  }catch(e){ /* ignore */ }
}

$("pc-save").addEventListener("click", async ()=>{
  const username = $("pc-username").value.trim();
  const password = $("pc-password").value;
  if(!username){ $("pc-msg").style.color="var(--bad)"; $("pc-msg").textContent="账号不能为空"; return; }
  $("pc-save").disabled = true;
  try{
    const r = await fetch("/api/v1/pool/proxy-credentials", {
      method:"POST", credentials:"include",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username, password})
    });
    if(r.status===401){ showBanner("未授权。"); return; }
    if(!r.ok){ const t=await r.text(); $("pc-msg").style.color="var(--bad)"; $("pc-msg").textContent="失败："+t; return; }
    $("pc-msg").style.color="var(--ok)";
    $("pc-msg").textContent="已保存（立即对所有端口生效）";
    $("pc-password").value="";
    await loadProxyCreds();
    await refresh();
  }catch(e){ $("pc-msg").style.color="var(--bad)"; $("pc-msg").textContent="错误："+e.message; }
  finally{ $("pc-save").disabled = false; }
});

let timer=null;
function schedule(){ if(timer) clearInterval(timer); if($("auto").checked) timer=setInterval(refresh,5000); }
$("auto").addEventListener("change", schedule);

refresh(); schedule(); loadProxyCreds();
</script>
</body>
</html>
